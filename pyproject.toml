[project]
name = "ai-home-buying-detective"
version = "0.1.0"
description = "A Week 1 LangChain and Streamlit property-fit analysis project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx==0.28.1",
    "langchain==1.3.14",
    "langchain-core==1.5.1",
    "langchain-openai==1.4.1",
    "openai==2.45.0",
    "pydantic==2.12.5",
    "python-dotenv==1.1.1",
    "streamlit==1.60.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
